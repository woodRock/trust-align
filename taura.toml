# taura (github.com/woodRock/taura): datasets recorded with every run, settings the paper may quote,
# and code whose change makes earlier results suspect. The paper is ~/overleaf/trust-align (by name).

[data.fish-oil]
path = "data/fish_oil"     # 90 GC-MS runs, five batches (a git-ignored symlink to the private data)
label = "fish-oil-90"

[settings.grid]            # script 02: thresholds, fixed λ, tuning seeds, bootstrap resamples
path = "scripts/02_full_sparsity.py"
names = ["TUNE_SEEDS", "FIXED_LAM", "TOL_MIN", "BREAK_MIN", "ALPHA", "N_BOOT"]

[settings.fish]            # script 04: the fish arm's budgets and corruption rates
path = "scripts/04_fish_sparsity.py"
names = ["BUDGETS", "EPSILONS", "DRIFTED_R"]

[runs]
watch = ["src/trustalign"]
