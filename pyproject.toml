[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trustalign"
version = "0.2.1"
description = "When Can Joint Retention-Time Alignment Be Trusted? Graph Connectivity and Corrupted Correspondences in GC-MS"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesse Wood" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # Direct references, pinned to pushed commits (neither is on PyPI). alignbench is pinned to the
    # commit joint-align itself pins; bump both deliberately, since every result file records them.
    # Local development against editable checkouts: see the README (install with --no-deps).
    "alignbench @ git+https://github.com/woodRock/align-bench.git@879510f93f055d18db35ed62f17141a0ffaea1a7",
    "joint-align @ git+https://github.com/woodRock/joint-align.git@132ecb40067731d537a25f42fed6e724bc4b53b0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "ruff", "mypy", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/woodRock/trust-align"
Homepage = "https://woodrock.github.io/trust-align/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end runs of the numbered scripts on synthetic data (deselect with -m \"not slow\")",
]
filterwarnings = [
    "ignore:enable_nested_tensor is True:UserWarning",
]

[tool.coverage.run]
source = ["trustalign", "scripts"]
omit = [
    "scripts/__pycache__/*",
    # Scripts 05 and 06 read the experiment caches, which exist only locally (CI never has them); their
    # parsers and pure helpers are tested, the end-to-end runs are slow-marked local tests.
    "scripts/05_paper_figures.py",
    "scripts/06_site_data.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
# Same families and exceptions as joint-align and warpalign.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E702",     # short `a = …; b = …` statements
    "E731",     # small named lambdas
    "E741",     # 'l' as a name in short comprehensions
    "B905",     # zip() without strict=
    "C408",     # dict(...) calls
    "RUF001",   # ×, −, σ, τ etc. in strings and comments are intended
    "RUF002",
    "RUF003",
    "RUF005",   # list concatenation
    "SIM300",
]

[tool.ruff.lint.per-file-ignores]
# Sets BLAS thread limits before NumPy is imported.
"scripts/02_full_sparsity.py" = ["E402"]
"scripts/03_diagnose_lambda.py" = ["E402"]
"scripts/04_fish_sparsity.py" = ["E402"]
"scripts/05_paper_figures.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["trustalign"]
known-third-party = ["alignbench", "jointalign"]

[tool.mypy]
python_version = "3.11"
files = ["src/trustalign"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
